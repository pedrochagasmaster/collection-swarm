[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collection-swarm"
version = "0.1.0"
description = "AI-driven debt collection conversation simulator and strategy optimizer"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.40",
    "click>=8.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "rich>=13.7",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "markdown>=3.6",
    "bleach>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
collection-swarm = "collection_swarm.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"collection_swarm.web" = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
