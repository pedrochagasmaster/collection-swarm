name: docs

on:
  push:
    branches:
      - main
    paths:
      - "docs-site/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Strict build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MkDocs + Material
        run: |
          python -m pip install --upgrade pip
          pip install \
            "mkdocs==1.6.*" \
            "mkdocs-material==9.7.*" \
            "pymdown-extensions==10.*"
      - name: Build site (strict)
        run: mkdocs build --strict

  deploy:
    name: Deploy to gh-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MkDocs + Material
        run: |
          python -m pip install --upgrade pip
          pip install \
            "mkdocs==1.6.*" \
            "mkdocs-material==9.7.*" \
            "pymdown-extensions==10.*"
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Publishes the strict build to the gh-pages branch using ghp-import
      # (vendored by mkdocs). Only requires contents: write — no Pages API
      # admin scope, no pre-enablement step.
      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --force --no-history --strict
