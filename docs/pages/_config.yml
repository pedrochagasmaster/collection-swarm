title: Collection Swarm
description: AI-driven simulator for testing debt-collection strategies before they ever touch a real customer.
remote_theme: just-the-docs/just-the-docs@v0.10.0
url: https://pedrochagasmaster.github.io
baseurl: /collection-swarm

color_scheme: dark

aux_links:
  GitHub:
    - https://github.com/pedrochagasmaster/collection-swarm

nav_external_links:
  - title: GitHub Repository
    url: https://github.com/pedrochagasmaster/collection-swarm

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Collection Swarm &mdash; Synthetic debt-collection simulation framework."

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

callouts:
  warning:
    title: Warning
    color: yellow
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: green
