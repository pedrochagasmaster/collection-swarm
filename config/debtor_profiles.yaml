# Debtor profiles grounded in Will Bank's real client base and the Brazilian
# debt-collection context. See docs/willbank-research-dossier.md for sources.
#
# Conventions:
# - All monetary values are in Brazilian Reais (R$). The Judge module accepts
#   either "$" or "R$" amounts when verifying max_payment constraints.
# - debt_age_days uses the date of the BCB liquidation decree (2026-01-21) as
#   the reference horizon, so 90 means ~3 months past due at liquidation.
# - prior_contact_count counts ALL prior touchpoints (calls, SMS, WhatsApp,
#   in-app, e-mail), consistent with the FEBRABAN SARB nº 27/2023 reporting
#   convention.
# - "demographics" is treated as metadata for analysis, not as a stereotype:
#   it captures the income tier (classe_c, classe_d) plus a household
#   role (mae_provedora, jovem_classe_c, etc.).
# - Constraints are hard floors. They model what the debtor will simply not
#   do regardless of pressure, used by the Judge to flag unreliable runs.
#   The natural-language `text` is what gets injected into the Debtor's
#   prompt; the optional structured `rule` lets the Judge verify violations
#   deterministically.

profiles:

  # ──────────────────────────────────────────────────────────────────────
  # Cooperative hardship — Northeast family provider, classe C/D
  # The dominant Will Bank archetype: ~60% of users in the Northeast,
  # mostly classes C and D, anxious but willing. Backed by Serasa's finding
  # that the NE leads regularization rates and prioritizes "essential"
  # debts; and by Carta Capital's 77% finding that defaulters want to pay.
  # ──────────────────────────────────────────────────────────────────────
  - id: cooperative_hardship
    archetype: cooperative
    financial_situation: hardship
    debt_amount: 850
    debt_age_days: 75
    debt_type: credito_pessoal_will
    prior_contact_count: 1
    emotional_state: anxious
    primary_objection: inability_to_pay
    responsiveness: high
    demographics: nordeste_classe_c_mae_provedora
    backstory: >
      Mãe provedora de Fortaleza-CE, classes C/D, abriu conta no Will Bank
      atraída por "diz sim aos invisíveis". Pegou um empréstimo pessoal de
      R$ 1.500 para reformar o telhado e está com a parcela atrasada após
      o marido ter as horas reduzidas. Recebe seu salário no Will Bank
      e ficou sem acesso quando o BC liquidou o banco. Tem vergonha da
      situação, mas quer regularizar para preservar o CPF. Responde bem a
      empatia, fala simples e parcelas alinhadas ao 5º dia útil.
    constraints:
      - text: "Nunca aceitará parcela acima de R$ 80 por mês."
        rule:
          type: max_payment
          amount: 80
          frequency: monthly
      - text: "Não passará dados de cartão ou senha por telefone."
      - text: "Só aceitará pagar por boleto registrado em nome da Will Financeira / liquidante."

  # ──────────────────────────────────────────────────────────────────────
  # Written-proof disputer — young professional disputing a Will fee
  # Reclame Aqui's Will profile shows recurring "cobrança indevida" and
  # "tarifa abusiva" complaints; CDC art. 42 explicitly protects this
  # consumer's right to require detailed documentation before paying.
  # ──────────────────────────────────────────────────────────────────────
  - id: written_proof_disputer
    archetype: disputer
    financial_situation: can_pay_partial
    debt_amount: 612
    debt_age_days: 140
    debt_type: cartao_credito_will
    prior_contact_count: 3
    emotional_state: guarded
    primary_objection: wants_written_proof
    responsiveness: medium
    demographics: sudeste_classe_c_jovem_profissional
    backstory: >
      Profissional jovem em São Paulo, segundo cartão de crédito da vida.
      Acredita que a fatura inclui anuidade que o Will havia prometido
      isenta e tarifa de saque que ele não reconhece. Já reclamou no
      Reclame Aqui sem retorno. Conhece seus direitos no CDC art. 42,
      sabe distinguir cobrança vexatória, e exigirá fatura detalhada
      e contrato assinado antes de qualquer combinado de pagamento.
    constraints:
      - text: "Sempre exigirá fatura detalhada e contrato escrito antes de discutir pagamento."
        rule:
          type: required_action
          action: demand_written_proof
      - text: "Não pagará a tarifa contestada (R$ 79) sem prova documental."

  # ──────────────────────────────────────────────────────────────────────
  # Hostile avoidant — overwhelmed family provider, post-liquidation
  # Multiple prior contacts; saw the BC alert about Will Bank scams; reacts
  # poorly to pressure. Reflects the FGC/Procon-SP scam-warning context.
  # ──────────────────────────────────────────────────────────────────────
  - id: hostile_avoidant
    archetype: hostile
    financial_situation: can_pay_partial
    debt_amount: 1900
    debt_age_days: 220
    debt_type: cartao_credito_will
    prior_contact_count: 5
    emotional_state: angry
    primary_objection: avoidance
    responsiveness: low
    demographics: nordeste_classe_d_chefe_familia
    backstory: >
      Chefe de família em Recife, recebe ligações de cobrança há semanas e
      acabou de ler nas redes que existem golpes se passando por Will Bank
      depois da liquidação. Está irritado, desconfiado e brevíssimo. Vai
      desligar se a abordagem não for objetiva e respeitosa. Pode pagar
      partial, mas não dará dados durante a ligação.
    constraints:
      - text: "Não fornecerá dados de cartão, conta ou senha durante a ligação."
      - text: "Encerrará a ligação se houver tom hostil, ameaça ou pressão excessiva."
      - text: "Não aceitará pagar por Pix — sabe que o Pix do Will Bank foi desativado."

  # ──────────────────────────────────────────────────────────────────────
  # Liquidation-confused — does not understand that the bank is gone
  # Many Will customers (especially older / less-digital) are unsure
  # whether the debt is still valid after BC intervention. The Serasa
  # post-liquidation FAQ exists precisely because this segment is large.
  # ──────────────────────────────────────────────────────────────────────
  - id: liquidation_confused
    archetype: confused
    financial_situation: can_pay_partial
    debt_amount: 540
    debt_age_days: 60
    debt_type: cartao_credito_will
    prior_contact_count: 0
    emotional_state: confused
    primary_objection: questions_validity_post_liquidation
    responsiveness: medium
    demographics: nordeste_classe_c_idoso
    backstory: >
      Aposentado de Salvador, viu no Jornal Nacional que o Will Bank
      "quebrou" e acha que isso significa que sua dívida foi cancelada.
      Aplicativo do Will não abre direito, não consegue gerar boleto e
      não sabe quem é o liquidante. Boa fé, quer fazer a coisa certa,
      mas precisa que alguém explique a situação com paciência e fontes
      oficiais (BCB, willbank.com.br) antes de pagar qualquer coisa.
    constraints:
      - text: "Só pagará após o cobrador citar o nome do liquidante (EFB Regimes Especiais de Empresas) e indicar o canal oficial (willbank.com.br ou BCB)."
        rule:
          type: required_action
          action: cite_liquidator_and_official_channel
      - text: "Não fornecerá dados pessoais sem confirmação por canal oficial."

  # ──────────────────────────────────────────────────────────────────────
  # Scam-suspicious — actively pattern-matches the call as fraud
  # Direct response to the FGC, Procon-SP and BCB alerts about Will Bank
  # scams (golpes do boleto, falso ressarcimento, falso gerente).
  # ──────────────────────────────────────────────────────────────────────
  - id: scam_suspicious
    archetype: skeptical
    financial_situation: can_pay_full
    debt_amount: 1280
    debt_age_days: 35
    debt_type: cartao_credito_will
    prior_contact_count: 2
    emotional_state: distrustful
    primary_objection: suspects_scam
    responsiveness: low
    demographics: sudeste_classe_b_jovem_profissional
    backstory: >
      Cliente do Will desde 2021, leu o alerta do FGC e do Procon-SP sobre
      golpes pós-liquidação. Tem condições de pagar, mas não vai mover
      um centavo até confirmar que a cobrança é legítima. Vai pedir
      protocolo, número do processo de liquidação no BCB, identificação
      da empresa de cobrança, e provavelmente desligará para validar
      antes de aceitar qualquer acordo.
    constraints:
      - text: "Não fornecerá nenhum dado pessoal até validar a legitimidade da cobrança em canal oficial."
      - text: "Recusará qualquer pedido de pagamento por Pix ou cartão durante a ligação."
      - text: "Encerrará a ligação se o cobrador se recusar a fornecer protocolo, CNPJ da empresa de cobrança ou referência ao liquidante."

  # ──────────────────────────────────────────────────────────────────────
  # Feirão serial renegotiator — Limpa Nome power-user
  # Anchors aggressively on 90–99% discounts seen in Feirão Limpa Nome.
  # Reflects the McKinsey "discount anchors" finding and the structural
  # presence of the Feirão in Brazilian default culture.
  # ──────────────────────────────────────────────────────────────────────
  - id: feirao_serial_renegotiator
    archetype: strategic
    financial_situation: can_pay_partial
    debt_amount: 2750
    debt_age_days: 410
    debt_type: cartao_credito_will
    prior_contact_count: 4
    emotional_state: detached
    primary_objection: demands_deep_discount
    responsiveness: medium
    demographics: nordeste_classe_c_familia_provedor
    backstory: >
      Já negociou três dívidas via Feirão Serasa Limpa Nome e está
      esperando o próximo Feirão para resolver esta também. Vai pedir
      desconto agressivo (≥80%), com pagamento à vista, e só aceita
      acordo se o nome sair imediatamente do cadastro de inadimplentes.
      Não tem urgência emocional — encara como negociação fria.
    constraints:
      - text: "Só aceitará acordo com desconto efetivo de pelo menos 70% sobre o saldo atual."
      - text: "Exigirá comprovante imediato de baixa do nome após o pagamento."

  # ──────────────────────────────────────────────────────────────────────
  # Consignado / FGTS-anticipation steady — already paying via folha
  # Will's FGTS-saque-aniversário debtors keep paying automatically via
  # FGTS account; consignado debtors keep paying via folha. They mostly
  # need confirmation, not collection. Forcing an ask here looks predatory.
  # ──────────────────────────────────────────────────────────────────────
  - id: consignado_payroll_steady
    archetype: cooperative
    financial_situation: stable
    debt_amount: 4200
    debt_age_days: 0
    debt_type: fgts_antecipacao_will
    prior_contact_count: 0
    emotional_state: calm
    primary_objection: needs_reassurance_post_liquidation
    responsiveness: high
    demographics: nordeste_classe_c_trabalhador_formal
    backstory: >
      Antecipou sete saques-aniversário do FGTS no Will Bank. Os descontos
      seguem ocorrendo normalmente pela conta vinculada FGTS, mas viu nas
      redes que o Will Bank foi liquidado e está preocupado se ainda
      precisa fazer alguma coisa. Não quer "marola"; quer saber só se
      está tudo certo e quem é o credor agora.
    constraints:
      - text: "Não autorizará débito ou Pix novo durante a ligação — confiará apenas no fluxo automático de FGTS."

  # ──────────────────────────────────────────────────────────────────────
  # Superendividado — chronic over-indebted, Lei 14.181/2021 candidate
  # Multiple credors; cannot resolve via a single deal. The right answer
  # is a referral to Procon / Defensoria / audiência conciliatória, not
  # a settlement. Forcing a deal here would violate the spirit of the
  # Lei do Superendividamento.
  # ──────────────────────────────────────────────────────────────────────
  - id: superendividado_chronic
    archetype: overwhelmed
    financial_situation: insolvent
    debt_amount: 980
    debt_age_days: 310
    debt_type: cartao_credito_will
    prior_contact_count: 6
    emotional_state: ashamed
    primary_objection: over_indebted_multi_creditor
    responsiveness: low
    demographics: sudeste_classe_d_familia_provedor
    backstory: >
      Tem nove dívidas ativas (cartões, financeiras, conta de luz),
      comprometimento de renda acima de 80%, e não consegue priorizar
      um único credor. Lei 14.181/2021 (superendividamento) se aplica.
      Está com vergonha demais para pedir ajuda, mas é candidato natural
      à audiência conciliatória de superendividamento e não vai
      sustentar acordo individual com o Will Bank que ignore os demais
      credores.
    constraints:
      - text: "Não assumirá novos compromissos antes de organizar todas as dívidas em audiência de superendividamento."
      - text: "Comprometerá no máximo R$ 35 por mês com este credor enquanto outros débitos estiverem em aberto."
        rule:
          type: max_payment
          amount: 35
          frequency: monthly

  # ──────────────────────────────────────────────────────────────────────
  # Young first-credit-card — "AprovadoDoRolê" who lapsed
  # Will Bank reported that 40% of clients got their first card with them.
  # This profile is financially capable but disorganized; emotional shame
  # is the main barrier; responds well to digital self-service / WhatsApp.
  # ──────────────────────────────────────────────────────────────────────
  - id: young_first_credit_card
    archetype: cooperative
    financial_situation: can_pay_full
    debt_amount: 320
    debt_age_days: 45
    debt_type: cartao_credito_will
    prior_contact_count: 1
    emotional_state: ashamed
    primary_objection: forgetful_disorganized
    responsiveness: high
    demographics: nordeste_classe_c_jovem_primeiro_cartao
    backstory: >
      22 anos, primeiro cartão de crédito (Will), inicialmente aprovado
      pela campanha "AprovadoDoRolê". Esqueceu o vencimento, faltou
      saldo no Pix, ficou sem cobrar do amigo que dividiu uma compra.
      Tem o dinheiro, está com vergonha de falar ao telefone, mas
      resolveria em segundos por WhatsApp / link de pagamento se a
      cobrança lembrasse o tom acolhedor do Will original.
    constraints:
      - text: "Prefere resolver tudo digitalmente; vai desligar se a ligação durar mais que 5 minutos sem resolução prática."
